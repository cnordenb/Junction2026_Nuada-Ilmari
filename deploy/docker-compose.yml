# Live demo on the Hostinger VPS: the app plus Caddy for HTTPS on three hostnames.
#   DOMAIN=example.com GUARD_DEMO_KEY=... docker compose -f deploy/docker-compose.yml up -d --build
services:
  app:
    build: ..
    restart: unless-stopped
    environment:
      GUARD_DEMO_KEY: ${GUARD_DEMO_KEY:?set GUARD_DEMO_KEY}
      GUARD_SIM_EVERY: ${GUARD_SIM_EVERY:-20}
      SIGNUP_TRUST_PROXY: "1"            # Caddy overwrites X-Forwarded-For, so it can be trusted
    volumes:
      - guard-data:/var/guard
    expose:
      - "8000"
  caddy:
    image: caddy:2.10
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - app
volumes:
  guard-data:
  caddy-data:
